name: automerge
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Auto-merge Dependabot pull requests via GitHub's native auto-merge.
# Requires "Allow auto-merge" in the repository settings.
# Uses pull_request_target because Dependabot-triggered runs otherwise get
# a read-only token. Nothing is checked out, so this is safe.
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
